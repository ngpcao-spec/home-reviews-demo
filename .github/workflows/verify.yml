name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_DEMO_MODE: "false"
      - name: Verify no server secret is bundled
        run: "! grep -R -E 'OPENAI_API_KEY|sk-[A-Za-z0-9]' dist"
