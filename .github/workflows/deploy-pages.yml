name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_DEMO_MODE: "true"
      VITE_SUPABASE_URL: https://ihuztjkblywzjdruusdj.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JmaR5pwfuLSyrMNdvWE3Qw_bZAFUYLf
      REVIEW_PROVIDER: mock
      VITE_ROUTER_MODE: hash
      VITE_BASE_PATH: /home-reviews-demo/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
