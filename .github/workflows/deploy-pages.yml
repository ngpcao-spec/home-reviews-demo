name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_DEMO_MODE: "false"
      VITE_SUPABASE_URL: https://ihuztjkblywzjdruusdj.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_JmaR5pwfuLSyrMNdvWE3Qw_bZAFUYLf
      VITE_ROUTER_MODE: hash
      VITE_BASE_PATH: /home-reviews-demo/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          PAGES_ARTIFACT_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $PAGES_ARTIFACT_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              | jq --arg name "$PAGES_ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
            if [ "$count" = "1" ]; then exit 0; fi
            if [ "$count" -gt 1 ]; then
              echo 'More than one artifact matches this deployment attempt.' >&2
              exit 1
            fi
            sleep 5
          done
          echo 'Pages artifact metadata is not available yet.' >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
