name: Shared restaurant isolated validation
on:
  push:
    branches: [codex/shared-restaurants-auth-validation-20261109]
permissions:
  contents: read
jobs:
  isolated-stack:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Docker
        run: docker info --format '{{.ServerVersion}}'
      - name: Install test tools
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/pg-client" pg@8.16.3
          npx playwright install --with-deps chromium
      - name: Start disposable Supabase without project credentials
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/home-reviews-isolated"
          cd "$RUNNER_TEMP/home-reviews-isolated"
          npx --yes supabase@2.118.0 init
          npx --yes supabase@2.118.0 start > "$RUNNER_TEMP/supabase-start.log" 2>&1
          npx --yes supabase@2.118.0 status -o json > "$RUNNER_TEMP/local-status.json"
          curl --fail --silent http://127.0.0.1:54321/auth/v1/health
          docker exec supabase_db_home-reviews-isolated psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "alter system set cron.launch_active_jobs='off'"
          docker exec supabase_db_home-reviews-isolated psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c 'select pg_reload_conf()'
      - name: Load full schema and real Auth fixtures
        env:
          CI_PG_PACKAGE: ${{ runner.temp }}/pg-client
          CI_SUPABASE_STATUS: ${{ runner.temp }}/local-status.json
          CI_AUTH_FIXTURE: ${{ runner.temp }}/auth-fixture.json
        run: node tests/ci/shared-stack-prepare.mjs
      - name: Start real workers with isolated providers
        shell: bash
        run: |
          node tests/ci/prepare-edge-runtime.mjs
          node tests/ci/provider-server.mjs > "$RUNNER_TEMP/providers.log" 2>&1 &
          cd "$RUNNER_TEMP/home-reviews-isolated"
          npx --yes supabase@2.118.0 functions serve --no-verify-jwt --env-file test-functions.env > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/add-establishment)
            if [ "$code" = 401 ]; then exit 0; fi
            sleep 2
          done
          echo 'EDGE_RUNTIME_NOT_READY'
          exit 1
      - name: Browser with real Auth
        env:
          CI_AUTH_FIXTURE: ${{ runner.temp }}/auth-fixture.json
          CI_BROWSER_RECEIPT: ${{ runner.temp }}/browser-receipt.json
          CI_PG_PACKAGE: ${{ runner.temp }}/pg-client
          CI_SUPABASE_STATUS: ${{ runner.temp }}/local-status.json
        run: npx playwright test --config playwright.shared-stack.config.ts
      - name: Require every browser scenario
        if: always()
        env:
          CI_BROWSER_RECEIPT: ${{ runner.temp }}/browser-receipt.json
        run: node tests/ci/assert-browser-completion.mjs
      - name: Local failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/functions.log" ]; then
            tail -100 "$RUNNER_TEMP/functions.log"
          fi
          find test-results -name error-context.md -exec cat {} \; 2>/dev/null || true
      - name: Remove disposable services
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP/home-reviews-isolated"
          npx --yes supabase@2.118.0 stop --no-backup > /dev/null 2>&1 || true
