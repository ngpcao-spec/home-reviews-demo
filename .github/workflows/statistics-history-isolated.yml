name: Statistics history real Auth validation
on:
  push:
    branches: [codex/restaurant-statistics]
permissions:
  contents: read
jobs:
  isolated-statistics:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        run: |
          npm ci
          npm install --prefix "$RUNNER_TEMP/pg-client" pg@8.16.3
          npx playwright install --with-deps chromium
      - name: Start disposable Supabase without project credentials
        shell: bash
        run: |
          docker info --format '{{.ServerVersion}}'
          mkdir -p "$RUNNER_TEMP/home-reviews-isolated"
          cd "$RUNNER_TEMP/home-reviews-isolated"
          npx --yes supabase@2.118.0 init
          npx --yes supabase@2.118.0 start > "$RUNNER_TEMP/supabase-start.log" 2>&1
          npx --yes supabase@2.118.0 status -o json > "$RUNNER_TEMP/local-status.json"
          curl --fail --silent http://127.0.0.1:54321/auth/v1/health
          docker exec supabase_db_home-reviews-isolated psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c "alter system set cron.launch_active_jobs='off'"
          docker exec supabase_db_home-reviews-isolated psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c 'select pg_reload_conf()'
      - name: Reconstruct real schema and create two Auth accounts
        env:
          CI_DEFER_REVIEW_HISTORY: '1'
          CI_PG_PACKAGE: ${{ runner.temp }}/pg-client
          CI_SUPABASE_STATUS: ${{ runner.temp }}/local-status.json
          CI_AUTH_FIXTURE: ${{ runner.temp }}/auth-fixture.json
        run: node tests/ci/shared-stack-prepare.mjs
      - name: Seed and migrate while real ingestion is waiting
        env:
          CI_PG_PACKAGE: ${{ runner.temp }}/pg-client
          CI_SUPABASE_STATUS: ${{ runner.temp }}/local-status.json
          CI_AUTH_FIXTURE: ${{ runner.temp }}/auth-fixture.json
        run: node tests/ci/statistics-history-prepare.mjs
      - name: Start isolated Edge read functions
        shell: bash
        run: |
          node tests/ci/prepare-edge-runtime.mjs
          node tests/ci/provider-server.mjs > "$RUNNER_TEMP/providers.log" 2>&1 &
          cd "$RUNNER_TEMP/home-reviews-isolated"
          npx --yes supabase@2.118.0 functions serve --no-verify-jwt --env-file test-functions.env > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/parallel-reports)
            if [ "$code" = 401 ]; then exit 0; fi
            sleep 2
          done
          echo 'EDGE_RUNTIME_NOT_READY'; exit 1
      - name: Real Auth and browser statistics
        env:
          CI_AUTH_FIXTURE: ${{ runner.temp }}/auth-fixture.json
        run: npx playwright test --config playwright.statistics-auth.config.ts
      - name: Require browser, transition and zero provider calls
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const {passed}=JSON.parse(readFileSync('test-results/statistics-history/browser.json','utf8'));
          for(const name of ['fr-auth-scope','vi-auth-scope','fr-history-and-translation','vi-history-and-translation'])assert(passed.includes(name),name);
          const transition=JSON.parse(readFileSync('test-results/statistics-history/transition.json','utf8'));assert.equal(transition.distinctHistory,158);assert.equal(transition.reportSelection,150);assert(transition.migrationWaitObserved);
          const provider=await(await fetch('http://127.0.0.1:4411/control/status')).json();assert.equal(provider.runs.length,0);assert.equal(provider.aiCalls,0);
          console.log('ALL_REQUIRED_STATISTICS_SCENARIOS_PASSED_WITHOUT_PROVIDER_CALL');
          JS
      - name: Quality checks
        run: |
          npm run lint
          npm run test
          npm run build
      - name: Publish non-secret test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statistics-history-auth-evidence
          path: test-results/statistics-history/
          if-no-files-found: error
      - name: Local failure diagnostics
        if: failure()
        run: |
          grep -Ei 'error|failed|unhealthy|timeout|rate limit|connection refused' "$RUNNER_TEMP/supabase-start.log" | tail -30 || true
          find test-results -name error-context.md -exec cat {} \; 2>/dev/null || true
      - name: Remove disposable services
        if: always()
        run: |
          cd "$RUNNER_TEMP/home-reviews-isolated"
          npx --yes supabase@2.118.0 stop --no-backup > /dev/null 2>&1 || true
